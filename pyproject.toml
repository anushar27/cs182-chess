[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-icl-v2"
version = "0.1.0"
description = "Auditable fixed-policy chess-variant outcome experiments"
requires-python = ">=3.11"
dependencies = ["chess==1.11.2", "numpy==2.2.6"]

[project.optional-dependencies]
analysis = ["matplotlib==3.10.0"]
test = ["pytest==8.3.5", "pyffish==0.0.91"]
train = ["torch==2.6.0", "transformers==4.49.0", "peft==0.14.0", "accelerate==1.4.0", "safetensors==0.5.3"]

[tool.setuptools.package-data]
chess_icl_v2 = ["reference.ini"]

[project.scripts]
chess-icl = "chess_icl_v2.cli:main"

[tool.setuptools.packages.find]
include = ["chess_icl_v2*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
