# Small Transformer Model Configuration
model:
  name: "small"
  d_model: 256
  n_heads: 8
  n_layers: 8
  d_ff: 1024
  max_seq_len: 4096
  dropout: 0.1
  n_classes: 3

training:
  batch_size: 128
  lr: 3.0e-4
  weight_decay: 0.1
  max_steps: 20000
  eval_interval: 500

continue_training:
  batch_size: 32
  lr: 3.0e-5
  weight_decay: 0.1
  max_steps: 10000
  k_max: 8
  mix_ratio: 0.5
